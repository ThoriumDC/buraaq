name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selfhost:
    name: self-host
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install clang and lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Check clang
        shell: bash
        run: clang --version || "/c/Program Files/LLVM/bin/clang" --version
      - name: Self-host tests
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -File scripts/selfhost-test.ps1
      - name: Product verify
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -File scripts/selfhost-verify.ps1
      - name: Self-host tests
        if: runner.os != 'Windows'
        run: bash scripts/selfhost-test.sh
      - name: Product verify
        if: runner.os != 'Windows'
        run: bash scripts/selfhost-verify.sh
